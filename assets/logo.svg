<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Baithak">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect width="512" height="512" rx="112" fill="url(#tile)"/>

  <!-- speech bubble: the meeting -->
  <g fill="#FFFFFF">
    <path d="M128 352 L128 424 L196 352 Z"/>
    <rect x="72" y="136" width="304" height="216" rx="40"/>
  </g>

  <!-- note lines: the notes -->
  <g fill="#4F46E5">
    <rect x="112" y="190" width="224" height="20" rx="10"/>
    <rect x="112" y="234" width="224" height="20" rx="10"/>
    <rect x="112" y="278" width="144" height="20" rx="10"/>
  </g>

  <!-- sparkle: the AI -->
  <path transform="translate(404 116) scale(48)"
        fill="#FBBF24"
        d="M0-1C.1-.35.35-.1 1 0 .35.1.1.35 0 1-.1.35-.35.1-1 0-.35-.1-.1-.35 0-1Z"/>
</svg>

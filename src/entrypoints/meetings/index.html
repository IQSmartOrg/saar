<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Saar — Meetings</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <picture>
        <source media="(prefers-color-scheme: dark)" srcset="/logo-lockup-dark.png" />
        <img src="/logo-lockup.png" alt="Saar" height="26" />
      </picture>
      <input
        id="search"
        type="search"
        placeholder="Search meetings and transcripts…"
        spellcheck="false"
        aria-label="Search meetings and transcripts"
      />
    </header>

    <main class="split">
      <aside class="list" aria-label="Meetings">
        <div id="list"></div>
      </aside>
      <section id="detail" class="detail" aria-live="polite"></section>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>

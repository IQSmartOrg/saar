<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Saar</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <picture>
        <source media="(prefers-color-scheme: dark)" srcset="/logo-lockup-dark.png" />
        <img src="/logo-lockup.png" alt="Saar" height="22" />
      </picture>
    </header>

    <div class="body">
      <div class="seg" role="tablist" aria-label="Saar">
        <button id="tab-now" type="button" role="tab" aria-selected="true" aria-controls="pane-now">
          Now
        </button>
        <button
          id="tab-setup"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="pane-setup"
        >
          Setup
        </button>
      </div>

      <!-- ── Now ─────────────────────────────────────────────── -->
      <section id="pane-now" class="pane" role="tabpanel" aria-labelledby="tab-now">
        <div id="activity"></div>
        <button id="open" class="ghost">Open meetings</button>
      </section>

      <!-- ── Setup ───────────────────────────────────────────── -->
      <section id="pane-setup" class="pane" role="tabpanel" aria-labelledby="tab-setup" hidden>
        <p id="status" class="hint">Loading…</p>

        <label for="account">Notetaker account</label>
        <select id="account">
          <option value="">Loading accounts…</option>
        </select>
        <p class="hint">
          The Google account Saar joins your meetings as.
          <a href="#" id="account-refresh">Refresh</a>
        </p>

        <hr />

        <label class="toggle" for="mom-enabled">
          <input id="mom-enabled" type="checkbox" />
          <span>Summarise with AI</span>
        </label>
        <p class="hint">Turns the transcript into a summary, decisions and action items.</p>

        <div id="mom-config" hidden>
          <label for="llm-provider">Provider</label>
          <select id="llm-provider"></select>

          <label for="llm-url">Endpoint</label>
          <input id="llm-url" type="url" spellcheck="false" placeholder="http://localhost:11434/v1" />

          <label for="llm-key">API key</label>
          <input id="llm-key" type="password" spellcheck="false" placeholder="sk-…" />

          <label for="llm-model">Model</label>
          <div class="row">
            <select id="llm-model">
              <option value="">Test the connection to load models…</option>
            </select>
            <button id="llm-refresh" class="icon" type="button" title="Reload models">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 12a9 9 0 1 1-2.64-6.36" />
                <path d="M21 3v6h-6" />
              </svg>
              <span class="sr-only">Reload models</span>
            </button>
          </div>

          <p id="llm-hint" class="hint"></p>
          <button id="llm-test" class="secondary">Test connection</button>
          <p id="llm-result" class="hint"></p>
        </div>
      </section>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
